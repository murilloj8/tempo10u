<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tempo 10U — Motivational Stories</title>
<link rel="stylesheet" href="css/style.css?v=20261111b">
<style>
  .feature { display: block; text-decoration: none; background: linear-gradient(120deg, var(--bordeaux), var(--bordeaux-dark)); color: #fff; border-radius: 22px; padding: 24px; margin-bottom: 26px; transition: transform .12s; }
  .feature:hover { transform: translateY(-2px); }
  .feature h2 { color: #fff; margin: 4px 0; }
  .feature .who { color: var(--blue); font-weight: 700; margin-bottom: 8px; }
  .preview { display: flex; flex-direction: column; text-decoration: none; color: inherit; background: #fff; border: 1px solid var(--line); border-top: 6px solid var(--bordeaux); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); transition: transform .12s, box-shadow .12s; }
  .preview:hover { transform: translateY(-3px); box-shadow: 0 8px 22px rgba(74,18,40,.14); }
  .preview h3 { color: var(--bordeaux); margin: 8px 0 2px; font-size: 20px; }
  .preview .who { color: var(--muted); font-size: 13px; font-weight: 700; margin-bottom: 8px; }
  .preview p { font-size: 15px; margin: 0 0 12px; flex: 1; }
  .preview .more { font-weight: 800; color: var(--bordeaux); font-size: 14px; }
  .preview.read { border-top-color: var(--good); }
  .preview .done { color: var(--good); font-weight: 800; font-size: 12px; margin-left: 6px; }
</style>
</head>
<body>
<main>
  <div class="page-head">
    <span class="kicker">Stories</span>
    <h1>Motivational Stories</h1>
    <ul class="bul"><li>Real people who faced hard things — and kept going.</li><li>Tap a story to read it.</li><li>Talk about the question with your family or a teammate.</li></ul>
  </div>
  <a class="feature" id="feature" href="#"></a>
  <div class="grid grid-3" id="stories"></div>
</main>

<script src="js/config.js?v=20261111b"></script>
<script src="js/app.js?v=20261111b"></script>
<script src="js/stories-data.js?v=20261111b"></script>
<script>
(async function () {
  const user = await TEMPO.boot("stories", { study: true });
  if (!user) return;
  const esc = TEMPO.esc, S = window.TEMPO_STORIES, wk = TEMPO.weekNumber();
  const slug = (n) => n.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
  const teaser = (t) => { const m = t.match(/^.*?[.!?](\s|$)/); return m ? m[0].trim() : t.slice(0, 120); };
  let read = {};
  try { read = JSON.parse(localStorage.getItem("tempo_read_" + user.uid) || "{}"); } catch (e) {}
  const f = S[(wk - 1) % S.length];
  document.getElementById("feature").href = "story.html#" + slug(f.name);
  document.getElementById("feature").innerHTML = `<div class="kicker" style="color:var(--blue)">Story of the week · Week ${wk}</div>
    <h2>${esc(f.name)}</h2><div class="who">${esc(f.who)}</div><p style="margin:0 0 8px">${esc(teaser(f.story))}</p><b>Read the story →</b>`;
  document.getElementById("stories").innerHTML = S.map((s) => `
    <a class="preview ${read[slug(s.name)] ? "read" : ""}" href="story.html#${slug(s.name)}">
      <div><span class="pill b">${esc(s.value)}</span>${read[slug(s.name)] ? '<span class="done">✓ read</span>' : ""}</div>
      <h3>${esc(s.name)}</h3><div class="who">${esc(s.who)}</div>
      <p>${esc(teaser(s.story))}</p>
      <span class="more">Read more →</span>
    </a>`).join("");
})();
</script>
</body>
</html>
