<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tempo 10U — Inspiring Stories</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .feature { background: linear-gradient(120deg, var(--bordeaux), var(--bordeaux-dark)); color: #fff; border-radius: 22px; padding: 26px; margin-bottom: 26px; }
  .feature h2 { color: #fff; font-size: clamp(26px, 4vw, 34px); }
  .feature .who { color: var(--blue); font-weight: 700; margin-bottom: 10px; }
  .feature .lesson { background: rgba(255,255,255,.12); border-radius: 12px; padding: 10px 14px; margin-top: 12px; }
  .story h3 { font-size: 21px; margin: 6px 0 2px; }
  .story .who { color: var(--muted); font-size: 14px; font-weight: 700; margin-bottom: 10px; }
  .story .lesson { background: var(--blue-soft); border-radius: 10px; padding: 8px 12px; font-size: 15px; margin: 10px 0 8px; }
  .story .think { font-size: 15px; font-style: italic; color: var(--bordeaux); }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 18px; }
  .filters button { background: #fff; color: var(--bordeaux); border: 2px solid var(--bordeaux); padding: 7px 14px; }
  .filters button.on { background: var(--bordeaux); color: #fff; }
</style>
</head>
<body>
<main>
  <div class="page-head">
    <span class="kicker">Inspiring stories</span>
    <h1>They Never Gave Up</h1>
    <p>Real people who faced hard things — and kept going. Read one, then talk about the question with your family or a teammate.</p>
  </div>
  <div id="feature"></div>
  <div class="filters no-print" id="filters"></div>
  <div class="grid grid-2" id="stories"></div>
</main>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
const STORIES = [
  { name: "Michael Jordan", who: "Basketball · 6-time NBA champion", value: "Mistakes make me better",
    story: "When Michael was a sophomore in high school, he tried out for the varsity team — and didn't make it. He played on the junior varsity team instead. He was disappointed, but he used it as fuel. He practiced before school, after school and on weekends. By the next year he was the star of the varsity team, and he went on to become one of the greatest basketball players of all time.",
    lesson: "Not making a team is not the end of the story. It can be the start of a comeback.",
    think: "What is something you're not good at YET that you could practice every day?" },
  { name: "Wilma Rudolph", who: "Track & field · 3 Olympic gold medals (1960)", value: "Effort — every play",
    story: "As a little girl, Wilma got very sick with polio, and she had to wear a metal brace on her leg. Doctors weren't sure she would ever walk normally. Her family helped her do exercises every single day. By age 12 she could walk without the brace — and then she started running. In high school she was a basketball star, and at the 1960 Olympics she became the first American woman to win three gold medals in track at one Olympics.",
    lesson: "Small efforts, done every day, add up to something amazing.",
    think: "Who are the people who help you keep going when something is hard?" },
  { name: "Tamika Catchings", who: "Basketball · WNBA MVP & 4 Olympic gold medals", value: "I belong",
    story: "Tamika was born with hearing loss and wore hearing aids. Some kids teased her about the way she talked and about her hearing aids, and she felt different. She decided to work harder than everyone on the court. She became famous for her defense and hustle, won a WNBA championship and an MVP award, and helped Team USA win four Olympic gold medals.",
    lesson: "What makes you different is part of what makes you special. Your team needs what YOU bring.",
    think: "What is one unique thing you bring to our team?" },
  { name: "Sue Bird", who: "Basketball · 4 WNBA titles & 5 Olympic gold medals", value: "Pass first",
    story: "Sue Bird was a point guard who was famous for one thing above all: making her teammates better. She was one of the best passers basketball has ever seen, always finding the open player for an easy basket. Her teams won four WNBA championships, and she won five Olympic gold medals with Team USA.",
    lesson: "The extra pass is the best pass. When your teammates win, you win.",
    think: "How does it feel when a teammate passes you the ball for an easy basket?" },
  { name: "Muggsy Bogues", who: "Basketball · shortest player in NBA history (5'3\")", value: "Tough defense",
    story: "Muggsy was only 5 feet 3 inches tall — shorter than many middle schoolers! Lots of people said he was too small to play in the NBA. Instead of worrying about his height, he focused on what he COULD do: be super quick, pass the ball, and play pesky, never-quit defense. He played 14 seasons in the NBA.",
    lesson: "Don't focus on what you don't have. Focus on what you can do better than anyone.",
    think: "What's your superpower on the court — speed, defense, passing, hustle, cheering?" },
  { name: "Becky Hammon", who: "Basketball player & championship coach", value: "I control what I can",
    story: "Becky wasn't picked in the WNBA draft. She made a team anyway and became a six-time All-Star. After she retired, she became the first woman to be a full-time assistant coach in the NBA, with the San Antonio Spurs. Later, as head coach of the Las Vegas Aces, she led her team to back-to-back WNBA championships.",
    lesson: "Other people don't get to decide how far you'll go. Your effort and attitude do.",
    think: "Is there something people told you that you couldn't do? How could you prove it wrong?" },
  { name: "Stephen Curry", who: "Basketball · 4-time NBA champion", value: "Effort — every play",
    story: "In high school, Steph was small and skinny, and the big college basketball programs didn't want him. He went to a small school called Davidson College and kept working on his shot — thousands of shots, again and again. He became one of the best shooters ever and changed how basketball is played.",
    lesson: "Hard work beats being overlooked. Keep practicing even when nobody is watching.",
    think: "How many shots could you practice this week?" },
  { name: "Dawn Staley", who: "Basketball player & national championship coach", value: "I lift my teammates",
    story: "Dawn grew up in North Philadelphia, playing basketball on the playground against the boys. People said she was too small. She became a great point guard, won three Olympic gold medals as a player, and later became a coach. Her South Carolina teams have won national championships, and she's known for caring about her players as people, not just athletes.",
    lesson: "Great leaders lift everyone around them.",
    think: "What is one way you can lift up a teammate at our next practice?" },
  { name: "Jim Abbott", who: "Baseball · Major League pitcher", value: "I control what I can",
    story: "Jim was born without a right hand. He loved baseball and taught himself to pitch with his left hand and then quickly slip his glove on to field the ball. He practiced by throwing a ball against a wall for hours. He made it to the Major Leagues, and in 1993 he pitched a no-hitter for the New York Yankees — one of the hardest things to do in baseball.",
    lesson: "Find your own way. There's more than one way to do something great.",
    think: "What's a creative way you could practice a skill at home?" },
  { name: "Bethany Hamilton", who: "Surfing · professional surfer", value: "Mistakes make me better",
    story: "When Bethany was 13, she lost her left arm in a shark attack while surfing in Hawaii. Most people thought her surfing days were over. About a month later she was back on her surfboard, learning a new way to paddle and stand up. She went on to compete against the best surfers in the world.",
    lesson: "When something knocks you down, you can learn a new way to get back up.",
    think: "What does 'next play' mean to you after a mistake?" },
  { name: "Simone Biles", who: "Gymnastics · Olympic champion", value: "Together we are more",
    story: "Simone is one of the greatest gymnasts ever. At the Tokyo Olympics, she realized her mind and body weren't working together safely, so she stepped back from some events to take care of herself — and she cheered loudly for her teammates. It took courage. Three years later, at the Paris Olympics, she came back and won three gold medals.",
    lesson: "Taking care of yourself is strong, and cheering for your team is a way to contribute too.",
    think: "How can you help your team even when you're on the bench?" },
  { name: "Katherine Johnson", who: "NASA mathematician", value: "Together we are more",
    story: "Katherine loved numbers. As a Black woman in the 1950s and 60s, she faced unfair rules that kept people apart. She worked at NASA anyway, and her math was so trusted that astronaut John Glenn asked for her to check the computer's numbers before his flight around the Earth in 1962. Her work helped the team send astronauts to space and the Moon.",
    lesson: "Big goals need a whole team — and every person's job matters.",
    think: "What is YOUR job on our team that helps us win?" }
];

(async function () {
  if (!(await TEMPO.boot("stories", { study: true }))) return;
  const esc = TEMPO.esc, wk = TEMPO.weekNumber();
  const f = STORIES[(wk - 1) % STORIES.length];
  document.getElementById("feature").innerHTML = `<div class="feature">
    <div class="kicker" style="color:var(--blue)">Story of the week · Week ${wk}</div>
    <h2>${esc(f.name)}</h2><div class="who">${esc(f.who)}</div>
    <p style="font-size:18px">${esc(f.story)}</p>
    <div class="lesson"><b>The lesson:</b> ${esc(f.lesson)}<br><i>Think about it: ${esc(f.think)}</i></div></div>`;
  const values = ["All", ...new Set(STORIES.map((s) => s.value))];
  let cur = "All";
  function render() {
    document.getElementById("filters").innerHTML = values.map((v) => `<button class="${v === cur ? "on" : ""}" data-v="${v}">${v}</button>`).join("");
    document.getElementById("stories").innerHTML = STORIES.filter((s) => cur === "All" || s.value === cur).map((s) => `
      <div class="card accent story"><span class="pill b">${esc(s.value)}</span>
        <h3>${esc(s.name)}</h3><div class="who">${esc(s.who)}</div>
        <p>${esc(s.story)}</p>
        <div class="lesson"><b>The lesson:</b> ${esc(s.lesson)}</div>
        <div class="think">Think about it: ${esc(s.think)}</div></div>`).join("");
  }
  document.getElementById("filters").onclick = (e) => { if (e.target.dataset.v) { cur = e.target.dataset.v; render(); } };
  render();
})();
</script>
</body>
</html>
