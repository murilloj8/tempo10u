<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tempo 10U — Story of the Week</title>
<link rel="stylesheet" href="css/style.css?v=20261111c">
<style>
  .story { max-width: 760px; margin: 0 auto; }
  .story .hero { margin-bottom: 20px; }
  .story .who { color: var(--blue); font-weight: 700; }
  .story .body li { font-size: 19px; line-height: 1.6; }
  .lesson { background: var(--blue-soft); border-left: 5px solid var(--blue-dark); border-radius: 12px; padding: 14px 18px; font-size: 17px; margin: 18px 0; }
  .think { background: var(--bordeaux-soft); border-left: 5px solid var(--bordeaux); border-radius: 12px; padding: 14px 18px; font-size: 17px; font-style: italic; }
</style>
</head>
<body>
<main>
  <article class="story" id="story"></article>
</main>

<script src="js/config.js?v=20261111c"></script>
<script src="js/app.js?v=20261111c"></script>
<script src="js/stories-data.js?v=20261111c"></script>
<script>
(async function () {
  const user = await TEMPO.boot("stories", { study: true });
  if (!user) return;
  const esc = TEMPO.esc, wk = TEMPO.weekNumber();
  const s = TEMPO.storyForWeek(wk, await TEMPO.storyPlan());
  document.title = "Tempo 10U — " + s.name;
  document.getElementById("story").innerHTML = `
    <div class="hero">
      <div class="kicker" style="color:var(--blue)">Story of the week · Week ${wk}${s.value ? " · " + esc(s.value) : ""}</div>
      <h1>${esc(s.name)}</h1>
      ${s.who ? `<div class="who">${esc(s.who)}</div>` : ""}
    </div>
    <div class="body"><ul class="bul">${String(s.story).split(/(?<=[.!?])\s+(?=[A-Z])/).filter(Boolean).map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>
    ${s.lesson ? `<div class="lesson"><b>The lesson:</b> ${esc(s.lesson)}</div>` : ""}
    ${s.think ? `<div class="think"><b>Think about it:</b> ${esc(s.think)}</div>` : ""}`;
})();
</script>
</body>
</html>
