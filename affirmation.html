<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tempo 10U — I Am TEMPO</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .aff { max-width: 760px; margin: 0 auto; }
  .aff ol { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
  .aff li { display: grid; grid-template-columns: 52px 1fr; gap: 14px; align-items: start; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px; box-shadow: var(--shadow); font-size: 18px; }
  .aff li .n { width: 46px; height: 46px; border-radius: 50%; background: var(--blue-soft); color: var(--bordeaux); font-family: var(--display); font-size: 22px; display: grid; place-items: center; }
  .aff li b { color: var(--bordeaux); display: block; font-size: 20px; }
  .aff .close { text-align: center; font-size: 22px; font-style: italic; font-weight: 800; color: var(--bordeaux); margin: 22px 0; }
  .aff .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
</style>
</head>
<body>
<main>
  <div class="aff">
    <div class="page-head" style="text-align:center">
      <span class="kicker">Daily affirmation</span>
      <h1>I Am TEMPO</h1>
      <p style="margin:0 auto">Read it out loud — every day. Then tap <b>I said it!</b></p>
    </div>
    <ol id="list"></ol>
    <p class="close">Better than yesterday.<br>I am TEMPO. We set the pace!</p>
    <div class="actions no-print">
      <button id="saidIt">I said it! ✓</button>
    </div>
    <div id="msg" style="text-align:center"></div>
  </div>
</main>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
const AFF = [
  ["I belong.", "My team needs me."],
  ["Mistakes make me better.", "Next play!"],
  ["Together we are more.", "Your best + my best."],
  ["I defend every play.", "Low, loud, hands up."],
  ["I share the ball.", "I trust my team."],
  ["Every rebound is ours.", "Box out, two hands."],
  ["I control what I can.", "My effort. My attitude."],
  ["I lift my teammates.", "Cheer them up, pick them up."]
];
(async function () {
  const user = await TEMPO.boot("affirmation");
  if (!user) return;
  const esc = TEMPO.esc, $ = TEMPO.$;
  $("#list").innerHTML = AFF.map(([h, t], i) => `<li id="af${i}"><span class="n">${i + 1}</span><span><b>${esc(h)}</b>${esc(t)}</span></li>`).join("");
  async function done() {
    $("#saidIt").disabled = true; $("#saidIt").textContent = "Done today ✓";
    await TEMPO.logActivity("affirm");
    $("#msg").innerHTML = '<div class="msg ok">Affirmation checked off for today. You are TEMPO!</div>';
  }
  try {
    const today = TEMPO.dayKey(), a = (await TEMPO.myActivity()).find((x) => x.date === today);
    if (a && a.affirm) { $("#saidIt").disabled = true; $("#saidIt").textContent = "Done today ✓"; }
  } catch (e) {}
  $("#saidIt").onclick = done;
})();
</script>
</body>
</html>
