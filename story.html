<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tempo 10U — Story</title>
<link rel="stylesheet" href="css/style.css?v=20261111a">
<style>
  .story { max-width: 760px; margin: 0 auto; }
  .story .hero { margin-bottom: 20px; }
  .story .who { color: var(--blue); font-weight: 700; }
  .story .body p { font-size: 19px; line-height: 1.65; }
  .lesson { background: var(--blue-soft); border-left: 5px solid var(--blue-dark); border-radius: 12px; padding: 14px 18px; font-size: 17px; margin: 18px 0; }
  .think { background: var(--bordeaux-soft); border-left: 5px solid var(--bordeaux); border-radius: 12px; padding: 14px 18px; font-size: 17px; font-style: italic; }
  .pager { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 24px; }
</style>
</head>
<body>
<main>
  <article class="story" id="story"></article>
</main>

<script src="js/config.js?v=20261111a"></script>
<script src="js/app.js?v=20261111a"></script>
<script src="js/stories-data.js?v=20261111a"></script>
<script>
(async function () {
  const user = await TEMPO.boot("stories", { study: true });
  if (!user) return;
  const esc = TEMPO.esc, S = window.TEMPO_STORIES;
  const slug = (n) => n.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
  function show() {
    let i = S.findIndex((s) => slug(s.name) === location.hash.slice(1));
    if (i < 0) i = 0;
    const s = S[i], prev = S[(i - 1 + S.length) % S.length], next = S[(i + 1) % S.length];
    document.title = "Tempo 10U — " + s.name;
    document.getElementById("story").innerHTML = `
      <div class="hero">
        <div class="kicker" style="color:var(--blue)">Motivational story · ${esc(s.value)}</div>
        <h1>${esc(s.name)}</h1>
        <div class="who">${esc(s.who)}</div>
      </div>
      <div class="body"><p>${esc(s.story)}</p></div>
      <div class="lesson"><b>The lesson:</b> ${esc(s.lesson)}</div>
      <div class="think"><b>Think about it:</b> ${esc(s.think)}</div>
      <div class="pager no-print">
        <a class="btn ghost" href="story.html#${slug(prev.name)}">← ${esc(prev.name)}</a>
        <a class="btn ghost" href="stories.html">All stories</a>
        <a class="btn" href="story.html#${slug(next.name)}">${esc(next.name)} →</a>
      </div>`;
    try {
      const k = "tempo_read_" + user.uid, r = JSON.parse(localStorage.getItem(k) || "{}");
      r[slug(s.name)] = true; localStorage.setItem(k, JSON.stringify(r));
    } catch (e) {}
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", show);
  show();
})();
</script>
</body>
</html>
